<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignalScope — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #e84393; --pink-light: #fd79a8; --pink-soft: #fab1c4;
      --pink-pale: #ffe0ec; --pink-ghost: #fff0f5; --white: #ffffff;
      --bg: #fef6f9; --bg2: #ffffff; --card: #ffffff;
      --border: #f0d4e0; --text: #2d2235; --text2: #7a6b82; --text3: #b8a5c2;
      --green: #00b894; --red: #e17055;
      --shadow: 0 2px 16px rgba(232,67,147,0.07);
      --shadow-hover: 0 4px 24px rgba(232,67,147,0.13);
      --radius: 18px;
      --font: 'DM Sans', system-ui, sans-serif;
      --mono: 'Space Mono', monospace;
    }
    [data-theme="dark"] {
      --bg: #1a1020; --bg2: #231530; --card: #2a1a38;
      --border: #3d2650; --text: #f0e6f6; --text2: #b8a5c2;
      --text3: #6b5a78; --pink-ghost: #2a1a38; --pink-pale: #3d2650;
      --white: #f0e6f6;
      --shadow: 0 2px 16px rgba(0,0,0,0.3);
      --shadow-hover: 0 4px 24px rgba(232,67,147,0.2);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: background 0.4s, color 0.4s;
    }

    .auth-container {
      width: 100%; max-width: 420px; padding: 0 1.5rem;
    }
    .auth-header {
      text-align: center; margin-bottom: 2rem;
    }
    .auth-header .logo {
      display: inline-flex; align-items: center; gap: 0.7rem;
      font-size: 1.5rem; font-weight: 700; color: var(--pink);
      letter-spacing: -0.03em; margin-bottom: 0.5rem;
    }
    .logo-dot { width: 12px; height: 12px; background: var(--pink); border-radius: 50%; }
    .auth-header p { color: var(--text2); font-size: 0.9rem; }

    .auth-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 2rem;
      box-shadow: var(--shadow);
    }

    .tabs {
      display: flex; gap: 0; margin-bottom: 1.5rem;
      background: var(--pink-ghost); border-radius: 12px; padding: 4px;
    }
    .tab {
      flex: 1; padding: 0.6rem; text-align: center; font-size: 0.85rem;
      font-weight: 600; border-radius: 10px; cursor: pointer;
      color: var(--text2); transition: all 0.3s; border: none; background: none;
      font-family: var(--font);
    }
    .tab.active {
      background: var(--pink); color: white;
      box-shadow: 0 2px 8px rgba(232,67,147,0.3);
    }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: var(--text2); margin-bottom: 0.4rem;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .form-group input {
      width: 100%; padding: 0.7rem 1rem; border: 1.5px solid var(--border);
      border-radius: 12px; font-size: 0.9rem; font-family: var(--font);
      background: var(--bg); color: var(--text);
      transition: border-color 0.3s, box-shadow 0.3s; outline: none;
    }
    .form-group input:focus {
      border-color: var(--pink); box-shadow: 0 0 0 3px rgba(232,67,147,0.1);
    }

    .submit-btn {
      width: 100%; padding: 0.8rem; border: none; border-radius: 12px;
      background: var(--pink); color: white; font-size: 0.9rem;
      font-weight: 600; font-family: var(--font); cursor: pointer;
      transition: all 0.3s; margin-top: 0.5rem;
    }
    .submit-btn:hover { background: var(--pink-light); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-msg {
      background: rgba(225,112,85,0.1); color: var(--red);
      padding: 0.6rem 1rem; border-radius: 10px; font-size: 0.82rem;
      margin-bottom: 1rem; display: none; font-weight: 500;
    }
    .success-msg {
      background: rgba(0,184,148,0.1); color: var(--green);
      padding: 0.6rem 1rem; border-radius: 10px; font-size: 0.82rem;
      margin-bottom: 1rem; display: none; font-weight: 500;
    }

    .theme-btn {
      position: fixed; top: 1.5rem; right: 1.5rem;
      width: 50px; height: 26px; background: var(--pink-pale); border-radius: 13px;
      border: 2px solid var(--border); cursor: pointer; transition: all 0.3s;
    }
    .theme-btn::after {
      content: '☀️'; font-size: 0.7rem; position: absolute; top: 1px; left: 2px;
      width: 20px; height: 20px; background: var(--white); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.3s; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    [data-theme="dark"] .theme-btn { background: #3d2650; }
    [data-theme="dark"] .theme-btn::after { content: '🌙'; transform: translateX(22px); background: #4a2d60; }

    @media (max-width: 480px) {
      .auth-card { padding: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="theme-btn" onclick="toggleTheme()" title="Toggle theme"></div>

<div class="auth-container">
  <div class="auth-header">
    <div class="logo"><span class="logo-dot"></span> SignalScope</div>
    <p>WiFi Signal Mapping Dashboard</p>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="switchTab('login')">Log In</button>
      <button class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Your password" required />
      </div>
      <button type="submit" class="submit-btn" id="loginBtn">Log In</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signupForm" onsubmit="handleSignup(event)" style="display:none">
      <div class="form-group">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="Your name" required />
      </div>
      <div class="form-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Min 6 characters" required minlength="6" />
      </div>
      <button type="submit" class="submit-btn" id="signupBtn">Create Account</button>
    </form>
  </div>
</div>

<script>
  if (localStorage.getItem('token')) {
    window.location.href = '/';
  }

  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  }

  function switchTab(tab) {
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('successMsg').style.display = 'none';
    if (tab === 'login') {
      document.getElementById('loginTab').classList.add('active');
      document.getElementById('signupTab').classList.remove('active');
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('signupForm').style.display = 'none';
    } else {
      document.getElementById('signupTab').classList.add('active');
      document.getElementById('loginTab').classList.remove('active');
      document.getElementById('signupForm').style.display = 'block';
      document.getElementById('loginForm').style.display = 'none';
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('successMsg').style.display = 'none';
  }

  function showSuccess(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('errorMsg').style.display = 'none';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.error);
        return;
      }
      localStorage.setItem('token', data.token);
      localStorage.setItem('userName', data.user.name);
      window.location.href = '/';
    } catch (err) {
      showError('Network error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('signupName').value,
          email: document.getElementById('signupEmail').value,
          password: document.getElementById('signupPassword').value
        })
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.error);
        return;
      }
      localStorage.setItem('token', data.token);
      localStorage.setItem('userName', data.user.name);
      window.location.href = '/';
    } catch (err) {
      showError('Network error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  }
</script>
</body>
</html>
